name: android

on:
  push:
    branches: [main, master, android, starling]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { abi: arm64-v8a, target: aarch64-linux-android }
          - { abi: armeabi-v7a, target: armv7-linux-androideabi }
          - { abi: x86, target: i686-linux-android }
          - { abi: x86_64, target: x86_64-linux-android }
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install build-tools and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "build-tools;35.0.0" "platforms;android-36" "ndk;28.2.13676358" > /dev/null
      - name: Install Rust and cargo-ndk
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
          cargo install cargo-ndk --version 3.5.4 --locked
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-${{ matrix.abi }}
      - name: Build TML APK
        run: |
          python3 packaging/android/build_apk.py --abi ${{ matrix.abi }} --profile quick
      - uses: actions/upload-artifact@v4
        with:
          name: tml-apk-${{ matrix.abi }}
          path: target/android/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tml-apk-*
          path: target/android
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v1.0.0-${GITHUB_RUN_NUMBER}"
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          fi
          gh release create "$TAG_NAME" target/android/*.apk \
            --title "TML Client $TAG_NAME (Vanilla Pure Performance)" \
            --notes "TML Client: Vanilla Minecraft Java Edition 26.3 on Android. Pure performance edition with mods stripped, shader LOD macros integrated, and critical bug fixes applied." \
            --latest || gh release upload "$TAG_NAME" target/android/*.apk --clobber
